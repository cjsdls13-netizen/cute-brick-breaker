<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>말랑 벽돌깨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#ffe9f1;font-family:'Jua',sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:24px;box-shadow:0 12px 40px rgba(255,120,170,.35);cursor:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
const W=480,H=720,TOP=64;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const s=Math.min(innerWidth/W,innerHeight/H)*0.98;
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';
  cv.width=Math.round(W*s*dpr);cv.height=Math.round(H*s*dpr);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
addEventListener('resize',resize);resize();

const COLORS=[['#ffb3c7','#e8749a'],['#ffd59e','#e8a24f'],['#fff0a0','#d9bf45'],['#bff0c4','#6cc47a'],['#b8e4ff','#5aaee0'],['#d9c6ff','#9a7be0']];
const FACE='#5a3a4a';
const NOTES=[523,587,659,784,880,1047,1175,1319,1568,1760];
const LEVELS=[
  ['.11..11.','12211221','12222221','.322223.','..3443..','...55...'],
  ['5......5','55....55','55555555','5F5555F5','55511555','55555555','.555555.'],
  ['EEEEEEEE','11111111','22222222','33333333','44444444','55555555','66666666'],
  ['F.F.F.F.','.E.E.E.E','1.2.3.4.','.5.6.1.2','DDDDDDDD','3.4.5.6.'],
  ['..2222..','.233332.','23A33A32','23333332','23B33B32','.23BB32.','..2222..']
];
const ITEMS=[{k:'big',e:'🍓',w:4,msg:'패들 커짐!'},{k:'multi',e:'⭐',w:3,msg:'공이 3배!'},{k:'slow',e:'🍦',w:2,msg:'느릿느릿~'},{k:'life',e:'💖',w:1,msg:'생명 +1'}];

// ---------- 사운드 ----------
let AC=null,soundOn=true;
function ensureAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(f,d=0.08,type='sine',v=0.15,slide=0){
  if(!soundOn||!AC)return;
  try{
    const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,n);
    if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,n+d);
    g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.001,n+d);
    o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+0.02);
  }catch(e){}
}
function melody(fs,gap,type='triangle'){fs.forEach((f,i)=>setTimeout(()=>beep(f,.16,type,.12),i*gap));}

// ---------- 상태 ----------
let state='title',prevState='play',score=0,lives=3,level=0,best=0,combo=0,newBest=false;
let bricks=[],balls=[],items=[],parts=[],texts=[];
const paddle={cx:W/2,tcx:W/2,w:96,h:18,y:H-84,big:0,squish:0};
let slowT=0,clearT=0,overT=0,shake=0,t=0;
try{best=+localStorage.getItem('mallang-best')||0;}catch(e){}
function saveBest(){try{localStorage.setItem('mallang-best',best);}catch(e){}}
const clouds=Array.from({length:5},(_,i)=>({x:Math.random()*W,y:100+i*120+Math.random()*40,s:0.6+Math.random()*0.7,v:0.15+Math.random()*0.25}));
const sparkles=Array.from({length:18},()=>({x:Math.random()*W,y:TOP+Math.random()*(H-TOP),p:Math.random()*6}));

function buildLevel(){
  const map=LEVELS[level%LEVELS.length];
  const cols=8,gap=6,side=18,bw=(W-side*2-gap*(cols-1))/cols,bh=28;
  bricks=[];
  map.forEach((row,r)=>{[...row].forEach((ch,c)=>{
    if(ch==='.')return;
    const tough=ch>='A'&&ch<='F';
    const ci=tough?ch.charCodeAt(0)-65:(+ch-1);
    bricks.push({x:side+c*(bw+gap),y:TOP+36+r*(bh+gap),w:bw,h:bh,c:ci,hp:tough?2:1,max:tough?2:1,wob:0,blink:Math.random()*400});
  });});
}
function baseSpeed(){return Math.min(5+level*0.4,9);}
function resetBall(){balls=[{x:paddle.cx,y:paddle.y-10,vx:0,vy:0,r:9,stuck:true}];combo=0;}
function newGame(){score=0;lives=3;level=0;newBest=false;items=[];paddle.big=0;slowT=0;buildLevel();resetBall();state='ready';melody([523,659,784],90);}
function nextLevel(){level++;items=[];paddle.big=0;slowT=0;buildLevel();resetBall();state='ready';}
function launch(){
  for(const b of balls)if(b.stuck){
    b.stuck=false;const a=Math.random()*0.6-0.3,s=baseSpeed();
    b.vx=s*Math.sin(a);b.vy=-s*Math.cos(a);
  }
  beep(660,.12,'triangle',.12,1.6);state='play';
}
function loseLife(){
  lives--;paddle.big=0;slowT=0;items=[];
  beep(392,.35,'sawtooth',.07,0.4);shake=8;
  if(lives<=0){state='over';overT=0;if(score>best){best=score;newBest=true;saveBest();}setTimeout(()=>melody([523,440,349,262],160,'sine'),300);}
  else{resetBall();state='ready';}
}
function levelClear(){
  state='clear';clearT=0;
  const bonus=100*(level+1)+lives*50;score+=bonus;
  texts.push({x:W/2,y:H/2+60,s:'보너스 +'+bonus,life:1.6,c:'#e8749a',big:true});
  melody([523,659,784,1047,1319],100);
  for(let i=0;i<40;i++)burst(Math.random()*W,TOP+Math.random()*200,COLORS[i%6][0],1,5,true);
}

// ---------- 이펙트 ----------
function burst(x,y,c,n,spd,isHeart){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*spd+1;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,life:1,c,heart:isHeart&&Math.random()<0.6,size:4+Math.random()*5});}
}
function spawnItem(x,y){
  let r=Math.random()*ITEMS.reduce((s,i)=>s+i.w,0);
  for(const it of ITEMS){if((r-=it.w)<0){items.push({x,y,it,vy:2.2});return;}}
}
function applyItem(it){
  beep(880,.1,'triangle',.12);setTimeout(()=>beep(1320,.14,'triangle',.12),80);
  texts.push({x:paddle.cx,y:paddle.y-30,s:it.e+' '+it.msg,life:1.3,c:'#d45a8a'});
  if(it.k==='big')paddle.big=10000;
  else if(it.k==='slow')slowT=8000;
  else if(it.k==='life')lives=Math.min(lives+1,5);
  else if(it.k==='multi'){
    const add=[];
    for(const b of balls){if(b.stuck)continue;const sp=Math.hypot(b.vx,b.vy),a=Math.atan2(b.vy,b.vx);
      for(const d of[-0.45,0.45]){const nb={x:b.x,y:b.y,r:b.r,stuck:false,vx:sp*Math.cos(a+d),vy:sp*Math.sin(a+d)};fixAngle(nb);add.push(nb);}}
    balls.push(...add.slice(0,Math.max(0,15-balls.length)));
  }
}
function fixAngle(b){
  const sp=Math.hypot(b.vx,b.vy);if(!sp)return;
  if(Math.abs(b.vy)<sp*0.3){b.vy=(b.vy<0?-1:1)*sp*0.3;b.vx=(b.vx<0?-1:1)*Math.sqrt(sp*sp-b.vy*b.vy);}
}

// ---------- 물리 ----------
function hitBrick(br){
  br.hp--;br.wob=1;
  const col=COLORS[br.c],mx=br.x+br.w/2,my=br.y+br.h/2;
  if(br.hp<=0){
    combo++;const pts=10*combo*br.max;score+=pts;
    texts.push({x:mx,y:my,s:'+'+pts,life:1,c:col[1]});
    burst(mx,my,col[0],12,4,true);
    beep(NOTES[Math.min(combo-1,NOTES.length-1)],.13,'triangle',.13);
    shake=Math.max(shake,3);
    if(Math.random()<0.15)spawnItem(mx,my);
    if(bricks.every(x=>x.hp<=0))levelClear();
  }else{beep(330,.08,'square',.05);burst(mx,my,'#ffffff',6,2);}
}
function stepBall(b,s){
  b.x+=b.vx*s;b.y+=b.vy*s;
  if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);beep(600,.04,'sine',.05);}
  if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);beep(600,.04,'sine',.05);}
  if(b.y<TOP+b.r){b.y=TOP+b.r;b.vy=Math.abs(b.vy);beep(600,.04,'sine',.05);}
  if(b.y>H+b.r*2){b.dead=true;return true;}
  const p=paddle,px=p.cx-p.w/2;
  if(b.vy>0&&b.y+b.r>=p.y&&b.y-b.r<=p.y+p.h&&b.x>=px-b.r&&b.x<=px+p.w+b.r){
    const hit=Math.max(-1,Math.min(1,(b.x-p.cx)/(p.w/2)));
    const a=hit*1.05,sp=Math.hypot(b.vx,b.vy);
    b.vx=sp*Math.sin(a);b.vy=-sp*Math.cos(a);b.y=p.y-b.r;
    p.squish=1;combo=0;beep(440,.08,'sine',.12,1.3);
    burst(b.x,p.y,'#ffffff',4,2);
  }
  for(const br of bricks){
    if(br.hp<=0)continue;
    const cx=Math.max(br.x,Math.min(b.x,br.x+br.w)),cy=Math.max(br.y,Math.min(b.y,br.y+br.h));
    const dx=b.x-cx,dy=b.y-cy;
    if(dx*dx+dy*dy<b.r*b.r){
      const left=b.x<br.x+br.w/2,upper=b.y<br.y+br.h/2;
      const ox=left?(b.x+b.r-br.x):(br.x+br.w-(b.x-b.r));
      const oy=upper?(b.y+b.r-br.y):(br.y+br.h-(b.y-b.r));
      if(ox<oy){if(left){b.x-=ox;b.vx=-Math.abs(b.vx);}else{b.x+=ox;b.vx=Math.abs(b.vx);}}
      else{if(upper){b.y-=oy;b.vy=-Math.abs(b.vy);}else{b.y+=oy;b.vy=Math.abs(b.vy);}}
      fixAngle(b);hitBrick(br);
      break;
    }
  }
  return false;
}
const keys={};
function update(k,dt){
  const p=paddle;
  if(keys.ArrowLeft||keys.a)p.tcx-=11*k;
  if(keys.ArrowRight||keys.d)p.tcx+=11*k;
  const tw=p.big>0?150:96;p.w+=(tw-p.w)*Math.min(1,0.2*k);
  p.tcx=Math.max(p.w/2,Math.min(W-p.w/2,p.tcx));
  p.cx+=(p.tcx-p.cx)*Math.min(1,0.45*k);
  if(p.big>0)p.big-=dt;
  if(slowT>0)slowT-=dt;
  const mul=slowT>0?0.6:1;
  for(const b of balls){
    if(b.stuck){b.x=p.cx;b.y=p.y-b.r-1;continue;}
    const sp=Math.hypot(b.vx,b.vy)*mul*k,n=Math.max(1,Math.ceil(sp/4));
    for(let i=0;i<n;i++){if(stepBall(b,mul*k/n))break;if(state!=='play')break;}
  }
  balls=balls.filter(b=>!b.dead);
  if(state==='play'&&balls.length===0){loseLife();return;}
  for(const it of items){
    it.y+=it.vy*k;
    if(it.y+14>=p.y&&it.y-14<=p.y+p.h&&Math.abs(it.x-p.cx)<p.w/2+14){it.got=true;applyItem(it.it);}
  }
  items=items.filter(it=>!it.got&&it.y<H+30);
}
function updateFx(k){
  t+=k;
  for(const q of parts){q.x+=q.vx*k;q.y+=q.vy*k;q.vy+=0.14*k;q.life-=0.022*k;}
  parts=parts.filter(q=>q.life>0);
  for(const s of texts){s.y-=0.7*k;s.life-=0.02*k;}
  texts=texts.filter(s=>s.life>0);
  for(const br of bricks)br.wob=Math.max(0,br.wob-0.08*k);
  paddle.squish=Math.max(0,paddle.squish-0.1*k);
  shake=Math.max(0,shake-0.5*k);
  for(const c of clouds){c.x+=c.v*k;if(c.x>W+80)c.x=-80;}
}

// ---------- 그리기 ----------
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function dot(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function oval(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}
function heart(x,y,s,c){
  ctx.fillStyle=c;ctx.beginPath();y-=s*0.45;
  ctx.moveTo(x,y+s*0.3);
  ctx.bezierCurveTo(x,y,x-s*0.5,y-s*0.1,x-s*0.5,y+s*0.25);
  ctx.bezierCurveTo(x-s*0.5,y+s*0.55,x,y+s*0.75,x,y+s*0.95);
  ctx.bezierCurveTo(x,y+s*0.75,x+s*0.5,y+s*0.55,x+s*0.5,y+s*0.25);
  ctx.bezierCurveTo(x+s*0.5,y-s*0.1,x,y,x,y+s*0.3);ctx.fill();
}
function txt(s,x,y,size,color,align='center',stroke=true){
  ctx.font=size+"px 'Jua',sans-serif";ctx.textAlign=align;ctx.textBaseline='middle';
  if(stroke){ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size/6);ctx.strokeStyle='#fff';ctx.strokeText(s,x,y);}
  ctx.fillStyle=color;ctx.fillText(s,x,y);
}
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ffe3ee');g.addColorStop(1,'#e6dcff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.55)';
  for(const c of clouds){oval(c.x,c.y,34*c.s,16*c.s);oval(c.x-22*c.s,c.y+5*c.s,20*c.s,12*c.s);oval(c.x+24*c.s,c.y+5*c.s,22*c.s,12*c.s);}
  for(const s of sparkles){const a=(Math.sin(t*0.05+s.p)+1)/2;ctx.fillStyle='rgba(255,255,255,'+(0.3+a*0.6)+')';
    const r=1.5+a*2;ctx.beginPath();ctx.moveTo(s.x,s.y-r*2);ctx.lineTo(s.x+r*0.5,s.y);ctx.lineTo(s.x,s.y+r*2);ctx.lineTo(s.x-r*0.5,s.y);ctx.fill();
    ctx.beginPath();ctx.moveTo(s.x-r*2,s.y);ctx.lineTo(s.x,s.y+r*0.5);ctx.lineTo(s.x+r*2,s.y);ctx.lineTo(s.x,s.y-r*0.5);ctx.fill();}
}
function drawBrick(br){
  const col=COLORS[br.c];
  ctx.save();ctx.translate(br.x+br.w/2,br.y+br.h/2);ctx.scale(1+br.wob*0.12,1-br.wob*0.12);
  const x=-br.w/2,y=-br.h/2;
  ctx.fillStyle=col[1];rr(x,y+3,br.w,br.h,10);ctx.fill();
  ctx.fillStyle=col[0];rr(x,y,br.w,br.h,10);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)';rr(x+6,y+4,br.w*0.4,5,3);ctx.fill();
  if(br.max>1){ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2.5;ctx.setLineDash(br.hp<br.max?[4,4]:[]);rr(x+3,y+3,br.w-6,br.h-6,7);ctx.stroke();ctx.setLineDash([]);}
  ctx.fillStyle=FACE;ctx.strokeStyle=FACE;ctx.lineWidth=1.8;ctx.lineCap='round';ctx.lineJoin='round';
  const blink=((t+br.blink)%260)<8;
  if(br.hp<br.max){ctx.beginPath();ctx.moveTo(-10,-3);ctx.lineTo(-6,0);ctx.lineTo(-10,3);ctx.moveTo(10,-3);ctx.lineTo(6,0);ctx.lineTo(10,3);ctx.stroke();}
  else if(blink){ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(-5,0);ctx.moveTo(5,0);ctx.lineTo(9,0);ctx.stroke();}
  else{dot(-7,0,2.3);dot(7,0,2.3);ctx.fillStyle='#fff';dot(-6.2,-0.8,0.8);dot(7.8,-0.8,0.8);}
  ctx.beginPath();ctx.arc(-2,3,2,0.1*Math.PI,0.9*Math.PI);ctx.moveTo(4,3.6);ctx.arc(2,3,2,0.1*Math.PI,0.9*Math.PI);ctx.stroke();
  ctx.fillStyle='rgba(255,110,150,.4)';oval(-14,5,3.5,2.2);oval(14,5,3.5,2.2);
  ctx.restore();
}
function drawPaddle(){
  const p=paddle,w=p.w,h=p.h;
  ctx.save();ctx.translate(p.cx,p.y+h/2);ctx.scale(1+p.squish*0.08,1-p.squish*0.25);
  for(const s of[-1,1]){const ex=s*w*0.3;
    ctx.fillStyle='#ff8fb1';ctx.beginPath();ctx.moveTo(ex-9,-h/2+4);ctx.lineTo(ex+s*2,-h/2-10);ctx.lineTo(ex+9,-h/2+4);ctx.fill();
    ctx.fillStyle='#ffd1df';ctx.beginPath();ctx.moveTo(ex-4.5,-h/2+3);ctx.lineTo(ex+s*1.5,-h/2-5);ctx.lineTo(ex+4.5,-h/2+3);ctx.fill();}
  ctx.fillStyle='#e8749a';rr(-w/2,-h/2+4,w,h,h/2);ctx.fill();
  ctx.fillStyle=p.big>0?'#ffb0c9':'#ff9fbf';rr(-w/2,-h/2,w,h,h/2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';rr(-w/2+10,-h/2+3,w*0.3,4,2);ctx.fill();
  ctx.fillStyle=FACE;ctx.strokeStyle=FACE;ctx.lineWidth=1.6;ctx.lineCap='round';
  dot(-9,-1,2.2);dot(9,-1,2.2);
  ctx.beginPath();ctx.arc(-2.4,2,2.4,0,Math.PI);ctx.moveTo(4.8,2);ctx.arc(2.4,2,2.4,0,Math.PI);ctx.stroke();
  ctx.fillStyle='rgba(255,90,140,.45)';oval(-17,3,4,2.4);oval(17,3,4,2.4);
  ctx.restore();
}
function drawBall(b){
  ctx.save();ctx.translate(b.x,b.y);
  ctx.fillStyle='rgba(120,60,100,.12)';oval(2,3,b.r,b.r*0.9);
  ctx.fillStyle=slowT>0?'#e3f6ff':'#ffffff';dot(0,0,b.r);
  ctx.strokeStyle='#ff9fbf';ctx.lineWidth=2;ctx.stroke();
  const sp=Math.hypot(b.vx,b.vy)||1,lx=b.stuck?0:b.vx/sp*1.5,ly=b.stuck?-1:b.vy/sp*1.5;
  ctx.fillStyle=FACE;dot(-3+lx,-1+ly,1.6);dot(3+lx,-1+ly,1.6);
  ctx.fillStyle='rgba(255,110,150,.5)';oval(-5,2.5,2,1.3);oval(5,2.5,2,1.3);
  ctx.restore();
}
function drawItem(it){
  const bob=Math.sin(t*0.12+it.x)*3;
  ctx.save();ctx.translate(it.x,it.y+bob);
  ctx.fillStyle='rgba(255,255,255,.85)';dot(0,0,15);
  ctx.strokeStyle='#ffb3c7';ctx.lineWidth=2;ctx.stroke();
  ctx.font="18px sans-serif";ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.it.e,0,1);
  ctx.restore();
}
function drawHud(){
  ctx.fillStyle='rgba(255,255,255,.75)';rr(8,8,W-16,48,18);ctx.fill();
  txt('⭐ '+score,24,33,22,'#d45a8a','left',false);
  txt('Lv.'+(level+1),W/2-20,33,22,'#9a7be0','center',false);
  for(let i=0;i<lives;i++)heart(W-72-i*24,32,20,'#ff7aa2');
  ctx.font="20px sans-serif";ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(soundOn?'🔊':'🔇',W-32,33);
  if(paddle.big>0||slowT>0){let s='';if(paddle.big>0)s+='🍓 '+Math.ceil(paddle.big/1000)+'  ';if(slowT>0)s+='🍦 '+Math.ceil(slowT/1000);txt(s.trim(),W/2,H-24,18,'#d45a8a');}
}
function panel(y,h){ctx.fillStyle='rgba(255,255,255,.88)';rr(40,y,W-80,h,28);ctx.fill();ctx.strokeStyle='#ffc2d4';ctx.lineWidth=3;ctx.stroke();}
function drawOverlay(){
  const pulse=1+Math.sin(t*0.1)*0.05;
  if(state==='title'){
    ctx.fillStyle='rgba(255,240,246,.55)';ctx.fillRect(0,0,W,H);
    panel(150,430);
    const title='말랑 벽돌깨기';
    [...title].forEach((ch,i)=>txt(ch,W/2-(title.length-1)*19+i*38,215+Math.sin(t*0.08+i*0.7)*6,42,COLORS[i%6][1]));
    txt('🐱 🍓 ⭐ 🍦 💖',W/2,272,26,'#000',  'center',false);
    txt('마우스 / 손가락으로 패들을 움직이고',W/2,320,19,'#7a5a6a','center',false);
    txt('클릭 · 탭 · 스페이스로 공을 발사!',W/2,348,19,'#7a5a6a','center',false);
    txt('🍓 패들 커짐   ⭐ 공 3배',W/2,396,18,'#9a7be0','center',false);
    txt('🍦 느려짐   💖 생명 +1',W/2,424,18,'#9a7be0','center',false);
    txt('최고 점수 '+best,W/2,470,18,'#e8a24f','center',false);
    ctx.save();ctx.translate(W/2,530);ctx.scale(pulse,pulse);txt('▶ 눌러서 시작!',0,0,30,'#ff6f9c');ctx.restore();
  }else if(state==='ready'){
    ctx.save();ctx.translate(W/2,H-40);ctx.scale(pulse,pulse);txt('탭 / 클릭 / 스페이스로 발사!',0,0,20,'#d45a8a');ctx.restore();
  }else if(state==='pause'){
    ctx.fillStyle='rgba(255,240,246,.6)';ctx.fillRect(0,0,W,H);
    panel(270,150);txt('잠깐 쉬는 중 ☕',W/2,320,34,'#9a7be0');txt('눌러서 계속하기',W/2,370,20,'#7a5a6a','center',false);
  }else if(state==='clear'){
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(pulse,pulse);txt('레벨 클리어! 🎉',0,0,44,'#ff6f9c');ctx.restore();
  }else if(state==='over'){
    ctx.fillStyle='rgba(255,240,246,.6)';ctx.fillRect(0,0,W,H);
    panel(200,320);
    txt('게임 오버',W/2,255,44,'#e8749a');
    txt('😿',W/2,310,40,'#000','center',false);
    txt('점수 '+score,W/2,365,28,'#d45a8a','center',false);
    txt(newBest?'✨ 새 최고 기록! ✨':'최고 점수 '+best,W/2,402,20,'#e8a24f','center',false);
    if(overT>800){ctx.save();ctx.translate(W/2,465);ctx.scale(pulse,pulse);txt('▶ 다시 하기',0,0,28,'#ff6f9c');ctx.restore();}
  }
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawBg();
  for(const br of bricks)if(br.hp>0)drawBrick(br);
  for(const it of items)drawItem(it);
  drawPaddle();
  for(const b of balls)drawBall(b);
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);if(q.heart)heart(q.x,q.y,q.size*1.6,q.c);else{ctx.fillStyle=q.c;dot(q.x,q.y,q.size/2);}}
  ctx.globalAlpha=1;
  for(const s of texts){ctx.globalAlpha=Math.max(0,Math.min(1,s.life));txt(s.s,s.x,s.y,s.big?28:18,s.c);}
  ctx.globalAlpha=1;
  ctx.restore();
  drawHud();
  drawOverlay();
}

// ---------- 입력 ----------
function toGame(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function togglePause(){if(state==='play'||state==='ready'){prevState=state;state='pause';}else if(state==='pause')state=prevState;}
function action(){
  ensureAudio();
  if(state==='title')newGame();
  else if(state==='ready')launch();
  else if(state==='clear'&&clearT>600)nextLevel();
  else if(state==='over'&&overT>800)newGame();
  else if(state==='pause')state=prevState;
}
addEventListener('pointermove',e=>{paddle.tcx=toGame(e).x;});
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();const p=toGame(e);
  if(p.y<TOP&&p.x>W-60){ensureAudio();soundOn=!soundOn;return;}
  if(state==='play'||state==='ready')paddle.tcx=p.x;
  action();
});
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();action();}
  else if(e.key==='p'||e.key==='P'||e.key==='Escape')togglePause();
  else if(e.key==='m'||e.key==='M')soundOn=!soundOn;
  if(e.key.startsWith('Arrow'))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.key]=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='play'||state==='ready'))togglePause();});

// ---------- 루프 ----------
buildLevel();resetBall();
let last=performance.now();
function loop(now){
  const dt=Math.min(50,now-last);last=now;const k=dt/16.667;
  if(state==='play'||state==='ready')update(k,dt);
  else if(state==='clear'){clearT+=dt;if(clearT>2400)nextLevel();}
  else if(state==='over')overT+=dt;
  updateFx(k);draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
